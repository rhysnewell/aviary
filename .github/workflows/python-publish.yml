# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish Python 🐍 distributions 📦 to PyPI and uploads to GitHub

on:
  push:
    tags:
      - v*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        # setuptools_scm derives the version from the git tag, and checkout
        # defaults to a depth-1 clone with no tags fetched -- which would make
        # it fall back to 0.0.0 and publish that to PyPI.
        fetch-depth: 0
    - name: Set env
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      # `python -m build`, not the legacy `python setup.py sdist`: only a
      # PEP 517 build honours [build-system] requires in pyproject.toml, which
      # is what installs setuptools_scm into the isolated build env. Under
      # setup.py the plugin is simply absent and the version silently becomes
      # 0.0.0. (pypa/build was already being pip-installed above but never
      # used.)
      run: >-
        python -m build --sdist
    - name: Publish distribution 📦 to PyPI
      if: startsWith(github.ref, 'refs/tags')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true
