name: Deploy documentation site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs-pdf.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/deploy-docs.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pages: read
  id-token: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website and PDF manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libcairo2 libffi-dev libgdk-pixbuf-2.0-0 \
            libpango-1.0-0 libpangocairo-1.0-0 shared-mime-info
      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Validate website
        run: mkdocs build --strict
      - name: Build website and PDF manual
        run: mkdocs build --config-file mkdocs-pdf.yml
      - name: Verify generated manual
        run: test -s site/pdf/aviary-manual.pdf
      - name: Deploy to gh-pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f site/
          git commit -m "Deploy docs to gh-pages"
          git push origin `git subtree split --prefix site main`:gh-pages --force
