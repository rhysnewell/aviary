name: Deploy documentation site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs-pdf.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/deploy-docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website and PDF manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libcairo2 libffi-dev libgdk-pixbuf-2.0-0 \
            libpango-1.0-0 libpangocairo-1.0-0 shared-mime-info
      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Validate website
        run: mkdocs build --strict
      - name: Build website and PDF manual
        run: mkdocs build --config-file mkdocs-pdf.yml
      - name: Verify generated manual
        run: test -s site/pdf/aviary-manual.pdf
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
