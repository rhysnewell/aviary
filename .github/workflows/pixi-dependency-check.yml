name: Pixi dependency check

# On every push to main (i.e. each merged PR), re-solves every pixi
# environment against the newest packages aviary/pixi.toml allows (nothing is
# installed), diffs that against the committed aviary/pixi.lock, and comments
# the result on the PR that produced the commit. Pushes without a PR (e.g. a
# release commit) only get the job summary. Nothing is committed: the
# re-solved lock is uploaded as an artifact for review.
#
# Running on push rather than pull_request also means fork PRs get the
# comment: push runs have a write token, fork pull_request runs do not.

on:
  push: 

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pixi-dependency-check
  cancel-in-progress: false  # each merged PR gets its own report

env:
  # Same pixi as the one that writes aviary/pixi.lock, so lockfile format or
  # solver differences between pixi versions do not show up as "updates".
  PIXI_VERSION: v0.71.1
  MANIFEST: aviary/pixi.toml
  MAX_POST_CHARS: "60000"

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION="$PIXI_VERSION" bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Re-solve against the latest allowed packages
        id: solve
        run: |
          set -o pipefail
          # No `|| true` here: a failed solve must fail the job, not be
          # reported as "everything is up to date".
          pixi update --json --no-install --manifest-path "$MANIFEST" > updates.json
          if jq -e '(.environment // {}) | length == 0' updates.json > /dev/null; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            pixi exec pixi-diff-to-markdown < updates.json > updates.md
          fi

      - name: Build the report
        if: steps.solve.outcome == 'success'
        env:
          OUTDATED: ${{ steps.solve.outputs.outdated }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os

          footer = f"\n<sub>Generated by the Pixi dependency check workflow on commit {os.environ['SHA'][:7]}.</sub>\n"
          header = "## 📦 Pixi dependency check\n\n"
          if os.environ["OUTDATED"] != "true":
              full = post = header + "✅ Everything in `pixi.lock` is up to date.\n" + footer
          else:
              intro = (header + "Newer versions are available within the `pixi.toml` "
                       "constraints. Re-solved lock: `pixi-dependency-check` artifact "
                       "of this run.\n\n")
              report = open("updates.md").read()
              full = intro + report + footer
              post = (intro + explicit +
                      "\n*Implicit (transitive) dependency changes are in the job summary.*\n"
                      + footer)
          open("full.md", "w").write(full)
          open("post.md", "w").write(post)
          PY
          # Job summaries are capped at 1 MiB.
          head -c 1000000 full.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failed check
        # Any earlier failure (the solve or building the report) still leaves a
        # post.md, so the PR comment says the check failed instead of going
        # silent.
        if: failure()
        env:
          SOLVE_OUTCOME: ${{ steps.solve.outcome }}
        run: |
          if [ "$SOLVE_OUTCOME" = "failure" ]; then
            reason="\`pixi update\` failed, so it is unknown whether \`pixi.lock\` is up to date."
          else
            reason="The check failed before a report could be produced."
          fi
          {
            echo "## 📦 Pixi dependency check"
            echo
            echo "❌ $reason See the job log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee post.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the re-solved lock and report
        if: steps.solve.outcome == 'success' && steps.solve.outputs.outdated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pixi-dependency-check
          path: |
            aviary/pixi.lock
            updates.json
            full.md

      - name: Comment on the merged PR
        if: always() && hashFiles('post.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No PR is associated with ${GITHUB_SHA::7}; the report is in the job summary only."
            exit 0
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file post.md
